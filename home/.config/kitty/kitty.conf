
# --- Fonts ---
font_family      Pixel Code
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# --- Window & Padding ---
window_padding_width 10
hide_window_decorations no
confirm_os_window_close 0

# --- Cursor & Bell ---
cursor_shape beam
cursor_blink_interval 0.5
enable_audio_bell no

# --- Transparency & Background ---
background_opacity 0.90


# BEGIN_KITTY_THEME
# Matugen
include current-theme.conf
# END_KITTY_THEME

startup_session ~/.local/share/kitty/session.kitty-session

# --- Save session on exit / window close ---
# Map quitting Kitty (Ctrl+Shift+Q) to save session state first
map ctrl+shift+q combine : save_as_session --use-foreground-process ~/.local/share/kitty/session.kitty-session : quit

# (Optional) Quick manual save trigger with F1
map f1 save_as_session --use-foreground-process ~/.local/share/kitty/session.kitty-session


cursor_shape block
shell_integration no-cursor

term xterm-256color

# --- Switch to tabs using Alt + Number ---
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# ---
map alt+a previous_tab
map alt+d next_tab

# --- Switch to the last tab ---
map alt+0 goto_tab -1

# Enable the splits layout along with any default layouts you like
enabled_layouts splits, stack, tall

# Create splits in current working directory
map ctrl+shift+s launch --location=hsplit --cwd=current
map ctrl+shift+d launch --location=vsplit --cwd=current

# Move focus between splits (Vim-style navigation)
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right

# Resize active split
map ctrl+shift+left  resize_window narrower
map ctrl+shift+right resize_window wider
map ctrl+shift+up    resize_window taller
map ctrl+shift+down  resize_window shorter
