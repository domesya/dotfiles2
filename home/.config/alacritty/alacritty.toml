[general]
live_config_reload = true 

import = [
  "~/.config/alacritty/catppuccin-mocha.toml"
]

[env]
TERM = "xterm-256color"

[window]
padding = { x = 4, y = 4 }
dynamic_padding = true

[font]
normal = { family = "PxPlus IBM VGA 8x16" }
#normal = { family = "Inconsolata Nerd Font" }
size = 18.0

[terminal]
shell = { 
    program = "/bin/sh", 
    args = [
     "-c",
     #"zellij attach --create fumo",
     "tmux attach-session -t fumo 2>/dev/null || tmux new-session -s fumo"
     ] }
