[general]
live_config_reload = true 

import = [
  "~/.config/alacritty/colors.toml"
]

[env]
TERM = "xterm-256color"

[window]
padding = { x = 4, y = 4 }
dynamic_padding = true
opacity = 0.9

[font]
# normal = { 
#  family = "PxPlus IBM VGA 8x16",
# }
#normal = {
#  family = "UnifontExMono"
#}
# normal = {
#   family = "Cozette",
#   style = "HiDpi"
# }
# normal = {
#   family = "CozetteVector"
# }
normal = {
  family = "Pixel Code"
}

#normal = { family = "Inconsolata Nerd Font" }
size = 10.0

[terminal]
shell = { 
    program = "/usr/bin/zsh", 
    args = [
    #  "-c",
    #  #"zellij attach --create fumo",
    #  "tmux attach-session -t fumo 2>/dev/null || tmux new-session -s fumo"
    ] 
}

[keyboard]
bindings = [
  { key = "A", mods = "Alt", chars = "\u001ba" },
  { key = "D", mods = "Alt", chars = "\u001bd" }
]
