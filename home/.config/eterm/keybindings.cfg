[modifier]
mod=ctrl
mod2=alt

[eterm]
; mod+shift+w=close-tab
; mod+tab=next-tab
; mod2+shift+0=switch-to-last-tab
; mod2+shift+1=switch-to-tab-1
; mod2+shift+2=switch-to-tab-2
; mod2+shift+3=switch-to-tab-3
; mod2+shift+4=switch-to-tab-4
; mod2+shift+5=switch-to-tab-5
; mod2+shift+6=switch-to-tab-6
; mod2+shift+7=switch-to-tab-7
; mod2+shift+8=switch-to-tab-8
; mod2+shift+9=switch-to-tab-9
; mod2+shift+i=split-top
; mod2+shift+j=split-left
; mod2+shift+k=split-bottom
; mod2+shift+l=split-right
; mod+mod2+j=switch-to-previous-split
; mod+mod2+l=switch-to-next-split
; mod2+shift+0=switch-to-last-tab
; mod2+shift+1=switch-to-tab-1
; mod2+shift+i=split-top
; mod2+shift+j=split-left
; mod2+shift+k=split-bottom
; mod2+shift+l=split-right
mod+,=open-settings
mod+mod2+shift+g=terminal-find-previous
mod+pagedown=next-tab
mod+pageup=previous-tab
mod+shift+c=terminal-copy
mod+shift+f=terminal-find
mod+shift+f11=debug-widget-tree-view
mod+shift+g=terminal-find-next
mod+shift+left=move-tab-left
mod+shift+right=move-tab-right
mod+shift+t=create-new-terminal
mod+shift+tab=previous-tab
mod+shift+v=terminal-paste
mod+shift+w=close-tab
mod+mod2+j=switch-to-previous-split
mod+mod2+l=switch-to-next-split
mod2+shift+0=switch-to-last-tab
mod2+shift+1=switch-to-tab-1
mod2+shift+i=split-top
mod2+shift+j=split-left
mod2+shift+k=split-bottom
mod2+shift+l=split-right
mod2+.=terminal-font-size-grow
mod2+,=terminal-font-size-shrink

[eterm.state]
unbound=["switch-to-tab-2","switch-to-tab-3","switch-to-tab-4","switch-to-tab-5","switch-to-tab-6","switch-to-tab-7","switch-to-tab-8","switch-to-tab-9","terminal-rename","terminal-toggle-exclusive-mode"]

