[terminal]
execute_in_shell=/var/home/domes/.local/bin/rmux attach-session -t fumo 2>/dev/null || /var/home/domes/.local/bin/rmux new-session -s fumo
shell=
shell_arguments=
default_working_directory=
scrollback=10000
cursor_style=steady_block
framebuffer=0
close_on_exit=0
initial_tabs=1
exclusive_mode=0
new_terminal_behavior=current
scrollbar_type=overlay
scrollbar_mode=auto

[ui]
smooth_scroll=0

[font]
path=/var/home/domes/.local/share/fonts/progsole-ttf.ttf
fallback_path=/var/home/domes/.local/share/fonts/Symbola-13.otf
size=11.000000
hinting=full
antialiasing=grayscale
ui_path=
ui_size=11.500000

[window]
pixel_density=0.000000
frame_rate_limit=2147483646
vsync=0
exit_on_close=1
benchmark_mode=0
warn_before_closing=0
always_show_tab_bar=0
show_tab_bar_when_split=1
renderer_version=OpenGL ES 2
multisamples=0

[theme]
; ui_color_scheme=system
color_scheme=Afterglow
ui_color_scheme=dark

